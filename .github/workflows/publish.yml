name: Publish images

on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: Roaoch
          password: ${{ secrets.PACKAGER }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eternal-encoders/urfunavigator-web
          tags: |
            type=ref,event=tag
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.PACKAGER }}