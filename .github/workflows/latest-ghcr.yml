name: Latest Image

on:
    push:
        branches:
          - release

jobs:
    build_and_publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Build an push an image
              run: |
                docker login --username Roaoch --password ${{ secrets.PACKAGER }} ghcr.io
                docker build . --tag ghcr.io/eternal-encoders/urfunavigator-web:stable
                docker push ghcr.io/eternal-encoders/urfunavigator-web:stable